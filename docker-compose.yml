# Server layout convention (see server-config repo): each app under
# ~/Desktop/apps/<name> has its own docker-compose.yml; startup.sh runs
# `docker compose up -d --build` on boot. External port for langup_ai: 8002.
services:

  gateway:
    build: .
    container_name: langup-ai-gateway
    env_file:
      - .env
    environment:
      # inside the compose network Ollama is reachable by service name
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8002:8000"
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    container_name: langup-ai-ollama
    # Serve, then pull the configured model if it is not present yet.
    # OLLAMA_MODEL comes from .env (compose interpolation).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        sleep 3
        ollama pull "${OLLAMA_MODEL}"
        wait
    volumes:
      - ollama_models:/root/.ollama
    # NOT exposed to the host: only the gateway (with its API key) may talk to it.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30  # first boot downloads the model — give it time
    restart: unless-stopped

volumes:
  ollama_models:
